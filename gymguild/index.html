<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymGuild: train with your guild</title>
<meta name="description" content="GymGuild turns your training into a team game. Join a guild, log any workout, compete fairly.">
<style>
  :root{--bg:#08080a;--tx:#f6f6f8;--mu:#a0a0ad;--ac:#a797ff}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 90% at 80% 10%,#241f3d,var(--bg) 60%);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;padding:48px 24px;text-align:center}
  .ic{width:96px;height:96px;border-radius:24px;background:var(--ac);display:grid;place-items:center;margin:0 auto 22px}
  h1{font-size:40px;letter-spacing:-.02em;margin:0}
  p{color:var(--mu);font-size:18px}
  a.b{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:999px;background:var(--ac);color:#0b0b10;font-weight:700;text-decoration:none}
  footer{margin-top:36px;font-size:14px} footer a{color:var(--mu)}
</style>
</head>
<body><main>
  <div class="ic"><svg width="62" height="62" viewBox="0 0 100 100"><g fill="none" stroke="#0b0b10" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><polyline points="50 25 50 56"/><polyline points="50 30 31 12"/><polyline points="50 30 69 12"/><polyline points="50 56 33 88"/><polyline points="50 56 67 88"/></g><circle cx="50" cy="15" r="8.5" fill="#0b0b10"/></svg></div>
  <h1>GymGuild</h1>
  <p>Train with your guild. Every sport counts. Fair, verified leaderboards, and your gym to hold.</p>
  <a class="b" href="https://play.google.com/store/apps/details?id=co.theingredientlist.gymguild">Get it on Google Play</a>
  <footer><a href="/gymguild/privacy">Privacy policy</a> &nbsp;·&nbsp; <a href="mailto:theingredientlist.co@gmail.com">Contact</a></footer>
</main></body>
</html>
