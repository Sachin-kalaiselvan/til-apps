<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Ingredient List — Apps</title>
<meta name="description" content="Apps and games by The Ingredient List.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#13172a;--panel:#191e35;--line:#2c3454;--ink:#eae6f5;--dim:#9298b8;
    --gold:#f2c14e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;
    font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:46px 22px 90px}
  a{color:var(--gold)}
  h1{font-size:30px;margin:0 0 4px;letter-spacing:-.02em;font-weight:800}
  h2{font-size:18px;margin:34px 0 8px;font-weight:800}
  .sub{color:var(--dim);font-size:14px;margin:0 0 30px}
  .back{display:inline-block;color:var(--dim);font-size:13.5px;text-decoration:none;
    margin-bottom:26px;font-weight:600}
  .back:hover{color:var(--ink)}
  footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--dim);font-size:13px}
  .card{display:flex;gap:15px;align-items:center;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:11px}
  .card:hover{border-color:var(--gold)}
  .card img{width:58px;height:58px;border-radius:13px;flex:none}
  .card b{display:block;font-size:16.5px}
  .card span{color:var(--dim);font-size:13.5px}
  ul{padding-left:20px}
  li{margin:5px 0}
  p b{color:var(--ink)}

</style>
</head>
<body>
<div class="wrap">
<h1>The Ingredient List</h1>
<p class="sub">Apps and games we make.</p>

<a class="card" href="/coreblocks">
  <img src="/coreblocks/icon.png" alt="">
  <div><b>Core Blocks</b><span>Block puzzle with a merge twist · Android</span></div>
</a>

<footer>theingredientlist.co@gmail.com</footer>
</div></body></html>
